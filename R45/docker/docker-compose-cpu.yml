# =============================================================================
# Docker Compose for R-bio
# 用于运行 r-bio 镜像的完整配置
# =============================================================================
#
# 使用方法:
#   docker compose up -d          # 后台启动
#   docker compose logs -f        # 查看日志
#   docker compose down           # 停止并清理
#   docker compose ps             # 查看状态
#
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # R-bio CPU Final - 单细胞分析环境
  # -------------------------------------------------------------------------
  rbio-cpu:
    image: rbio:cpu
    container_name: rbio
    hostname: rbio
    command: /opt/venv/bin/jupyter lab --config=/home/${RSTUDIO_USER}/.jupyter/jupyter_server_config.py

    # -------------------------------------------------------------------------
    # 内存与性能调优
    # -------------------------------------------------------------------------
    shm_size: ${SHM_SIZE:-16g}
    ulimits:
      memlock: -1      # 允许锁定内存，RAPIDS 必需
      stack: 67108864  # 栈空间优化

    # -------------------------------------------------------------------------
    # 端口映射
    # -------------------------------------------------------------------------
    ports:
      # RStudio Server
      - "8787:8787"
      # Jupyter Lab
      - "8888:8888"
      # Shiny Server (可选，如需使用)
      - "3838:3838"

    # -------------------------------------------------------------------------
    # 环境变量
    # -------------------------------------------------------------------------
    env_file:
      - .env
    environment:
      # RStudio 认证
      - RSTUDIO_USER=${RSTUDIO_USER:-rstudio}
      - RSTUDIO_PASS=${RSTUDIO_PASS:-YourSecurePassword123!}

      # Jupyter Lab Token (留空表示自动生成)
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-}

      # AI API Key
      - OPEN_API_KEY=${API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}

      # 编码与缓存
      - PYTHONIOENCODING=utf-8
      - CUSTOM_PYTHON=/custom/python
      - CUSTOM_R=/custom/r
      - XDG_CACHE_HOME=/custom/.cache/python
      - XDG_CONFIG_HOME=/custom/.config/python
      - R_USER_CACHE_DIR=/custom/.cache/r
      - PIP_CACHE_DIR=/custom/.cache/pip
      - TMPDIR=/tmp
      - JOBLIB_TEMP_FOLDER=/tmp/joblib_cache

      # 线程限制，防止多核互相抢占
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-16}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-16}

      # -------------------------------------------------------------------------
      # 环境变量 - 代理配置 (根据网络环境可选)
      # -------------------------------------------------------------------------
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - GITHUB_PROXY=${GITHUB_PROXY:-}

      # -------------------------------------------------------------------------
      # 环境变量 - 镜像源配置
      # -------------------------------------------------------------------------
      - CRAN_URL=${CRAN_URL:-https://cloud.r-project.org}
      - BIOC_URL=${BIOC_URL:-https://bioconductor.org}
      - PIP_INDEX_URL=${PIP_INDEX_URL:-}
      - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST:-}

    # -------------------------------------------------------------------------
    # 交互支持
    # -------------------------------------------------------------------------
    stdin_open: true
    tty: true

    # -------------------------------------------------------------------------
    # 数据卷挂载
    # -------------------------------------------------------------------------
    volumes:
      - .entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      # 数据目录
      - ${DATA_PATH:-./data}:/data:rw
      # 临时目录 (不能放在容器内，污染环境且性能较差)
      - ${TEMP_PATH:-/tmp/rapids}:/tmp:rw
      # RStudio 用户主目录
      - rstudio:/home/rstudio:rw
      # Python 缓存持久化
      - python_local:/custom/python
      - r_local:/custom/r
      - config:/custom/.config
      - cache:/custom/.cache
      # Rprofile
      - ./Rprofile:/home/rstudio/.Rprofile:rw

    # -------------------------------------------------------------------------
    # 健康检查
    # -------------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # -------------------------------------------------------------------------
    # 重启策略
    # -------------------------------------------------------------------------
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # 日志配置
    # -------------------------------------------------------------------------
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    # -------------------------------------------------------------------------
    # 网络配置
    # -------------------------------------------------------------------------
    networks:
      - rbio-network

    # -------------------------------------------------------------------------
    # 工作目录
    # -------------------------------------------------------------------------
    working_dir: /data

networks:
  rbio-network:
    driver: bridge

volumes:
  rstudio:
    driver: local
  python_local:
    driver: local
  config:
    driver: local
  cache:
    driver: local
  r_local:
    driver: local